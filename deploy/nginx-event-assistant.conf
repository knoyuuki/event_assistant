# 会务助手 — nginx 配置（前端 + 内部接口）
# 部署脚本会用 config/prod.json 的 app.internal_token 替换 __INTERNAL_TOKEN__

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # 内部访问标记（由部署脚本生成，勿提交真实值）
    set $internal_token "__INTERNAL_TOKEN__";

    root /var/www/event_assistant;
    index index.html;

    access_log /var/log/nginx/event_assistant.access.log;
    error_log /var/log/nginx/event_assistant.error.log;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 内部 API：仅前端应用可用（nginx 代填内网标记头，后端据此放行）
    # 外部/签名接口统一走 :10025 的 /api/ea/**
    location /api/ {
        proxy_pass http://127.0.0.1:10023;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Internal-Access $internal_token;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 外部接口在 80 端口一律拒绝（只能走 10025）
    location /api/ea/ {
        return 404;
    }

    # 静态资源缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

# 外部签名接口：仅通过本端口 + /api/ea/** 访问后端（HMAC-SHA256 签名保护）
server {
    listen 10025;
    listen [::]:10025;
    server_name _;

    # 内部访问标记占位（本端口不需要，仅保持 server 上下文一致）
    set $internal_token "__INTERNAL_TOKEN__";

    access_log /var/log/nginx/event_assistant_ext.access.log;
    error_log /var/log/nginx/event_assistant_ext.error.log;

    location /api/ea/ {
        proxy_pass http://127.0.0.1:10023;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 其余路径一律拒绝
    location / {
        return 404;
    }
}
